name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  python:
    name: Python Checks
    runs-on: ubuntu-latest

    # Phase 4 is almost entirely database: without a Postgres here, the router tests
    # would skip in the only place that gates a merge (docs/adr/0018).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d db"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgresql://admin:admin@localhost:5432/db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          version: '0.9.22'

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Check formatting
        run: make check-format

      - name: Check linting
        run: make check-lint

      - name: Check import sorting
        run: make check-sort

      - name: Type check
        run: make type-check

      - name: Run core tests
        run: make test-core-host

  webapp:
    name: Webapp Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false
          version: 10.23.0

      - name: Install dependencies
        run: pnpm install

      - name: Check webapp (lint + format)
        run: make check-webapp

      - name: Run webapp tests
        run: make test-webapp
